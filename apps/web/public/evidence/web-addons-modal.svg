<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <title>Add-on offer modal before payment with dominant accept button and faint skip link</title>
  <rect width="1440" height="900" fill="#f8fafc"/>
  <rect width="1440" height="72" fill="#ffffff"/>
  <circle cx="64" cy="36" r="16" fill="#1d4ed8"/>
  <text x="92" y="43" font-size="20" font-weight="700" fill="#0f172a">Example Life</text>
  <!-- page underneath -->
  <text x="120" y="150" font-size="28" font-weight="700" fill="#0f172a">Review and pay</text>
  <rect x="120" y="190" width="640" height="360" rx="14" fill="#fff" stroke="#e2e8f0"/>
  <rect x="800" y="190" width="520" height="420" rx="14" fill="#fff" stroke="#e2e8f0"/>
  <rect x="150" y="230" width="400" height="16" rx="8" fill="#e2e8f0"/>
  <rect x="150" y="280" width="340" height="16" rx="8" fill="#e2e8f0"/>
  <rect x="150" y="330" width="380" height="16" rx="8" fill="#e2e8f0"/>
  <!-- overlay -->
  <rect width="1440" height="900" fill="#0f172a" opacity="0.55"/>
  <!-- modal -->
  <rect x="420" y="150" width="600" height="600" rx="18" fill="#fff"/>
  <circle cx="720" cy="206" r="26" fill="#dcfce7"/>
  <path d="M708 206l8 8 14-16" stroke="#16a34a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <text x="720" y="268" font-size="28" font-weight="800" fill="#0f172a" text-anchor="middle">Protect more for less</text>
  <text x="720" y="298" font-size="16" fill="#64748b" text-anchor="middle">Most customers like you add these covers</text>
  <g font-size="16">
    <rect x="470" y="330" width="500" height="64" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="494" y="368" fill="#16a34a" font-weight="700">✓</text><text x="520" y="368" fill="#0f172a">Hospital Cash</text><text x="946" y="368" fill="#334155" text-anchor="end">₹92/month</text>
    <rect x="470" y="406" width="500" height="64" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="494" y="444" fill="#16a34a" font-weight="700">✓</text><text x="520" y="444" fill="#0f172a">Accidental Disability</text><text x="946" y="444" fill="#334155" text-anchor="end">₹68/month</text>
    <rect x="470" y="482" width="500" height="64" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="494" y="520" fill="#16a34a" font-weight="700">✓</text><text x="520" y="520" fill="#0f172a">Premium Waiver on Job Loss</text><text x="946" y="520" fill="#334155" text-anchor="end">₹52/month</text>
  </g>
  <rect x="470" y="610" width="500" height="66" rx="12" fill="#16a34a"/>
  <text x="720" y="650" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">Continue with add-ons (+₹212/month)</text>
  <text x="720" y="712" font-size="11" fill="#cbd5e1" text-anchor="middle">Skip</text>
</svg>
