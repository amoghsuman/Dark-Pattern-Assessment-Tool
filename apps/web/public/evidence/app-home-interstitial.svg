<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
  <title>App home screen with cross-sell sheet shown on launch</title>
  <rect width="390" height="844" fill="#f8fafc"/>
  <text x="24" y="30" font-size="14" font-weight="600" fill="#0f172a">9:41</text>
  <text x="366" y="30" font-size="12" fill="#0f172a" text-anchor="end">5G ▮▮▮ 82%</text>
  <text x="24" y="80" font-size="20" font-weight="700" fill="#0f172a">Hi, Test Customer</text>
  <circle cx="350" cy="74" r="16" fill="#dbeafe"/>
  <rect x="16" y="110" width="358" height="170" rx="16" fill="#1d4ed8"/>
  <text x="36" y="146" font-size="13" fill="#bfdbfe">Example Secure Term Plus</text>
  <text x="36" y="182" font-size="26" font-weight="800" fill="#fff">₹1 crore cover</text>
  <text x="36" y="214" font-size="13" fill="#dbeafe">Policy ELI-TP-0042817 · Active</text>
  <rect x="36" y="232" width="120" height="32" rx="16" fill="#ffffff" opacity="0.2"/>
  <text x="96" y="253" font-size="13" fill="#fff" text-anchor="middle">View policy</text>
  <g font-size="12" fill="#334155" text-anchor="middle">
    <rect x="16" y="300" width="80" height="80" rx="14" fill="#fff" stroke="#e2e8f0"/><text x="56" y="366">Pay</text>
    <rect x="108" y="300" width="80" height="80" rx="14" fill="#fff" stroke="#e2e8f0"/><text x="148" y="366">Claims</text>
    <rect x="200" y="300" width="80" height="80" rx="14" fill="#fff" stroke="#e2e8f0"/><text x="240" y="366">Documents</text>
    <rect x="292" y="300" width="80" height="80" rx="14" fill="#fff" stroke="#e2e8f0"/><text x="332" y="366">Help</text>
  </g>
  <!-- overlay and sheet -->
  <rect width="390" height="844" fill="#0f172a" opacity="0.5"/>
  <rect x="24" y="220" width="342" height="400" rx="22" fill="#fff"/>
  <circle cx="195" cy="282" r="36" fill="#fef3c7"/>
  <path d="M195 262v24M183 274h24" stroke="#d97706" stroke-width="5" stroke-linecap="round"/>
  <text x="195" y="354" font-size="15" fill="#64748b" text-anchor="middle">Before you continue…</text>
  <text x="195" y="386" font-size="21" font-weight="800" fill="#0f172a" text-anchor="middle">Add Top-Up Health Cover</text>
  <text x="195" y="416" font-size="14" fill="#475569" text-anchor="middle">Extra ₹10 lakh hospital cover</text>
  <text x="195" y="438" font-size="14" fill="#475569" text-anchor="middle">from just ₹240/month</text>
  <rect x="48" y="490" width="294" height="52" rx="12" fill="#1d4ed8"/>
  <text x="195" y="522" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Add cover</text>
  <text x="195" y="581" font-size="14" fill="#64748b" text-anchor="middle">Remind me later</text>
  <rect x="0" y="780" width="390" height="64" fill="#fff" opacity="0.4"/>
</svg>
