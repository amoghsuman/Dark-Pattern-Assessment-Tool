<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <title>Grievance page that only offers an app download</title>
  <rect width="1440" height="900" fill="#f8fafc"/>
  <rect width="1440" height="72" fill="#ffffff"/>
  <line x1="0" y1="72" x2="1440" y2="72" stroke="#e2e8f0"/>
  <circle cx="64" cy="36" r="16" fill="#1d4ed8"/>
  <path d="M56 36l6 6 10-12" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="92" y="43" font-size="20" font-weight="700" fill="#0f172a">Example Life</text>
  <text x="300" y="130" font-size="14" fill="#64748b">Support › Raise a grievance</text>
  <text x="300" y="200" font-size="32" font-weight="700" fill="#0f172a">Raise a grievance</text>

  <rect x="300" y="250" width="840" height="170" rx="14" fill="#eef4ff" stroke="#bfdbfe"/>
  <rect x="332" y="282" width="44" height="72" rx="8" fill="none" stroke="#1d4ed8" stroke-width="3"/>
  <circle cx="354" cy="342" r="3" fill="#1d4ed8"/>
  <text x="400" y="306" font-size="21" font-weight="700" fill="#0f172a">Grievances can only be raised through the Example Life app.</text>
  <text x="400" y="342" font-size="16" fill="#334155">Download the app to track your complaint, upload documents and chat with our team.</text>
  <text x="400" y="374" font-size="16" fill="#334155">Scan the QR code or use the store links below.</text>

  <!-- QR and badges -->
  <rect x="540" y="460" width="160" height="160" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <g fill="#0f172a">
    <rect x="556" y="476" width="40" height="40"/><rect x="644" y="476" width="40" height="40"/><rect x="556" y="564" width="40" height="40"/>
    <rect x="610" y="490" width="14" height="14"/><rect x="620" y="530" width="14" height="14"/><rect x="600" y="556" width="14" height="14"/>
    <rect x="640" y="540" width="14" height="14"/><rect x="660" y="580" width="14" height="14"/><rect x="630" y="590" width="14" height="14"/>
  </g>
  <rect x="730" y="478" width="190" height="56" rx="10" fill="#0f172a"/>
  <text x="825" y="502" font-size="11" fill="#cbd5e1" text-anchor="middle">GET IT ON</text>
  <text x="825" y="522" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Google Play</text>
  <rect x="730" y="550" width="190" height="56" rx="10" fill="#0f172a"/>
  <text x="825" y="574" font-size="11" fill="#cbd5e1" text-anchor="middle">DOWNLOAD ON THE</text>
  <text x="825" y="594" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">App Store</text>

  <text x="720" y="720" font-size="15" fill="#1d4ed8" text-anchor="middle">I'd rather complain than read FAQs →</text>
  <text x="720" y="850" font-size="13" fill="#94a3b8" text-anchor="middle">Grievance Redressal Officer details are available in the app.</text>
</svg>
