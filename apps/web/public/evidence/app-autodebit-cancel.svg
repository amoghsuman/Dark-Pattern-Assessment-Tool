<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
  <title>Final step of auto-debit cancellation directing the customer to a branch</title>
  <rect width="390" height="844" fill="#f8fafc"/>
  <text x="24" y="30" font-size="14" font-weight="600" fill="#0f172a">9:41</text>
  <text x="366" y="30" font-size="12" fill="#0f172a" text-anchor="end">5G ▮▮▮ 82%</text>
  <text x="24" y="80" font-size="22" fill="#0f172a">←</text>
  <text x="60" y="80" font-size="19" font-weight="700" fill="#0f172a">Cancel auto-debit</text>
  <g>
    <circle cx="131" cy="140" r="6" fill="#1d4ed8"/><circle cx="163" cy="140" r="6" fill="#1d4ed8"/><circle cx="195" cy="140" r="6" fill="#1d4ed8"/><circle cx="227" cy="140" r="6" fill="#1d4ed8"/><circle cx="259" cy="140" r="6" fill="#1d4ed8"/>
  </g>
  <text x="195" y="178" font-size="13" fill="#64748b" text-anchor="middle">Step 5 of 5</text>

  <rect x="24" y="220" width="342" height="140" rx="14" fill="#fff7ed" stroke="#fdba74"/>
  <g font-size="15" fill="#7c2d12">
    <text x="44" y="254">To cancel your auto-debit mandate,</text>
    <text x="44" y="278">please visit your nearest branch or call</text>
    <text x="44" y="302" font-weight="700">1800 000 0000</text>
    <text x="44" y="326">(10 AM to 5 PM, Monday to Friday).</text>
  </g>

  <text x="24" y="410" font-size="16" font-weight="700" fill="#0f172a">Why stay on auto-debit?</text>
  <g font-size="14" fill="#334155">
    <text x="24" y="446">✓ Never miss a premium</text>
    <text x="24" y="476">✓ No late payment worries</text>
    <text x="24" y="506">✓ Keep your loyalty benefits</text>
    <text x="24" y="536">✓ Secure payments through your bank</text>
  </g>

  <rect x="24" y="700" width="342" height="56" rx="12" fill="#1d4ed8"/>
  <text x="195" y="734" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Keep auto-debit active</text>
  <text x="195" y="796" font-size="13" fill="#94a3b8" text-anchor="middle">Back to home</text>
</svg>
