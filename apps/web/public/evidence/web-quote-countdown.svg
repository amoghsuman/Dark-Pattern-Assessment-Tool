<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <title>Term plan quote page with countdown, scarcity badge and decline link</title>
  <rect width="1440" height="900" fill="#f8fafc"/>
  <rect width="1440" height="72" fill="#ffffff"/>
  <line x1="0" y1="72" x2="1440" y2="72" stroke="#e2e8f0"/>
  <circle cx="64" cy="36" r="16" fill="#1d4ed8"/>
  <path d="M56 36l6 6 10-12" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="92" y="43" font-size="20" font-weight="700" fill="#0f172a">Example Life</text>
  <text x="1376" y="42" font-size="15" fill="#334155" text-anchor="end">Need help? 1800 000 0000</text>

  <!-- countdown -->
  <rect x="120" y="100" width="740" height="60" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
  <circle cx="152" cy="130" r="11" fill="none" stroke="#b91c1c" stroke-width="2.5"/>
  <path d="M152 123v8l5 3" stroke="#b91c1c" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="176" y="137" font-size="19" font-weight="700" fill="#b91c1c">Special online price ends in 09:59</text>

  <!-- quote card -->
  <rect x="120" y="176" width="740" height="560" rx="14" fill="#fff" stroke="#e2e8f0"/>
  <text x="160" y="216" font-size="22" font-weight="700" fill="#0f172a">Example Secure Term Plus</text>
  <text x="160" y="240" font-size="14" fill="#64748b">Sum assured ₹1 crore · Cover to age 64 · Age 34, non-smoker</text>
  <text x="160" y="310" font-size="50" font-weight="800" fill="#0f172a">₹1,184</text>
  <text x="340" y="310" font-size="20" fill="#475569">/month</text>
  <rect x="600" y="250" width="240" height="40" rx="20" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="720" y="275" font-size="13" font-weight="600" fill="#92400e" text-anchor="middle">Only 3 policies left at this price</text>
  <line x1="160" y1="350" x2="820" y2="350" stroke="#e2e8f0"/>
  <g font-size="16" fill="#334155">
    <text x="160" y="392">✓ Life cover of ₹1 crore</text>
    <text x="160" y="428">✓ Terminal illness benefit included</text>
    <text x="160" y="464">✓ Tax benefit on premiums*</text>
    <text x="160" y="500">✓ 30-day free-look period</text>
    <text x="160" y="536">✓ Claim settlement support</text>
  </g>
  <rect x="160" y="600" width="300" height="60" rx="10" fill="#1d4ed8"/>
  <text x="310" y="637" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">Buy now</text>
  <text x="160" y="698" font-size="14" fill="#94a3b8" text-decoration="underline">No, I don't care about my family's future</text>

  <!-- side panel -->
  <rect x="900" y="100" width="420" height="400" rx="14" fill="#fff" stroke="#e2e8f0"/>
  <text x="930" y="144" font-size="18" font-weight="700" fill="#0f172a">Why buy online?</text>
  <g font-size="15" fill="#475569">
    <text x="930" y="184">• Lower premium than branch purchase</text>
    <text x="930" y="216">• Paperless proposal in 10 minutes</text>
    <text x="930" y="248">• Instant e-policy by e-mail</text>
    <text x="930" y="280">• Video medicals at home</text>
  </g>
  <line x1="930" y1="316" x2="1290" y2="316" stroke="#e2e8f0"/>
  <text x="930" y="354" font-size="15" fill="#334155">Premium breakdown</text>
  <text x="930" y="384" font-size="14" fill="#64748b">Base premium</text><text x="1290" y="384" font-size="14" fill="#334155" text-anchor="end">₹1,003.39</text>
  <text x="930" y="410" font-size="14" fill="#64748b">GST @ 18%</text><text x="1290" y="410" font-size="14" fill="#334155" text-anchor="end">₹180.61</text>
  <text x="930" y="456" font-size="15" fill="#1d4ed8">Compare with other plans →</text>
</svg>
