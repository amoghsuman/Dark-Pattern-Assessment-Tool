<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
  <title>Lock screen with six renewal reminders received in one day</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="390" height="844" fill="url(#bg)"/>
  <text x="24" y="30" font-size="14" font-weight="600" fill="#fff">19:42</text>
  <text x="366" y="30" font-size="12" fill="#fff" text-anchor="end">5G ▮▮▮ 64%</text>
  <text x="195" y="116" font-size="64" font-weight="300" fill="#fff" text-anchor="middle">19:42</text>
  <text x="195" y="150" font-size="16" fill="#cbd5e1" text-anchor="middle">Wednesday, 5 August</text>

  <g font-size="13">
    <!-- 1 -->
    <rect x="16" y="180" width="358" height="92" rx="18" fill="#fff" opacity="0.94"/>
    <rect x="30" y="194" width="20" height="20" rx="5" fill="#1d4ed8"/>
    <text x="58" y="209" font-size="11" fill="#64748b" letter-spacing="0.5">EXAMPLE LIFE</text><text x="358" y="209" font-size="11" fill="#64748b" text-anchor="end">6:00 PM</text>
    <text x="30" y="236" font-weight="700" fill="#0f172a">Your renewal is due</text>
    <text x="30" y="256" fill="#334155">Renew now to stay protected. Tap to pay.</text>
    <!-- 2 -->
    <rect x="16" y="282" width="358" height="92" rx="18" fill="#fff" opacity="0.94"/>
    <rect x="30" y="296" width="20" height="20" rx="5" fill="#1d4ed8"/>
    <text x="58" y="311" font-size="11" fill="#64748b" letter-spacing="0.5">EXAMPLE LIFE</text><text x="358" y="311" font-size="11" fill="#64748b" text-anchor="end">4:00 PM</text>
    <text x="30" y="338" font-weight="700" fill="#0f172a">Don't let your cover lapse</text>
    <text x="30" y="358" fill="#334155">Your family depends on you. Renew today.</text>
    <!-- 3 -->
    <rect x="16" y="384" width="358" height="92" rx="18" fill="#fff" opacity="0.94"/>
    <rect x="30" y="398" width="20" height="20" rx="5" fill="#1d4ed8"/>
    <text x="58" y="413" font-size="11" fill="#64748b" letter-spacing="0.5">EXAMPLE LIFE</text><text x="358" y="413" font-size="11" fill="#64748b" text-anchor="end">2:00 PM</text>
    <text x="30" y="440" font-weight="700" fill="#0f172a">Reminder: renewal pending</text>
    <text x="30" y="460" fill="#334155">Pay ₹14,208 in 2 taps.</text>
    <!-- 4 (false urgency) -->
    <rect x="16" y="486" width="358" height="92" rx="18" fill="#fff" opacity="0.94"/>
    <rect x="30" y="500" width="20" height="20" rx="5" fill="#1d4ed8"/>
    <text x="58" y="515" font-size="11" fill="#64748b" letter-spacing="0.5">EXAMPLE LIFE</text><text x="358" y="515" font-size="11" fill="#64748b" text-anchor="end">12:00 PM</text>
    <text x="30" y="542" font-weight="700" fill="#b91c1c">⏰ Only 2 hours left!</text>
    <text x="30" y="562" fill="#334155">Renew in the next 2 hours or lose your loyalty bonus!</text>
    <!-- 5 -->
    <rect x="16" y="588" width="358" height="92" rx="18" fill="#fff" opacity="0.94"/>
    <rect x="30" y="602" width="20" height="20" rx="5" fill="#1d4ed8"/>
    <text x="58" y="617" font-size="11" fill="#64748b" letter-spacing="0.5">EXAMPLE LIFE</text><text x="358" y="617" font-size="11" fill="#64748b" text-anchor="end">10:00 AM</text>
    <text x="30" y="644" font-weight="700" fill="#0f172a">Renew your policy</text>
    <text x="30" y="664" fill="#334155">Your policy renewal is due on 18 August.</text>
    <!-- 6 -->
    <rect x="16" y="690" width="358" height="92" rx="18" fill="#fff" opacity="0.94"/>
    <rect x="30" y="704" width="20" height="20" rx="5" fill="#1d4ed8"/>
    <text x="58" y="719" font-size="11" fill="#64748b" letter-spacing="0.5">EXAMPLE LIFE</text><text x="358" y="719" font-size="11" fill="#64748b" text-anchor="end">8:00 AM</text>
    <text x="30" y="746" font-weight="700" fill="#0f172a">Good morning! Renewal due soon</text>
    <text x="30" y="766" fill="#334155">Renew now and stay covered.</text>
  </g>
  <rect x="145" y="820" width="100" height="5" rx="2.5" fill="#fff" opacity="0.7"/>
</svg>
